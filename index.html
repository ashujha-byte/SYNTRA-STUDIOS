<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 1. Google Site Name Metadata (Jisse "Vercel" ki jagah aapka naam aaye) -->
    <title>Ashu Jha — Professional Web Developer &amp; UI/UX Designer</title>
    <meta name="application-name" content="Ashu Jha" />
    <meta name="apple-mobile-web-app-title" content="Ashu Jha" />
    <meta property="og:site_name" content="Ashu Jha" />

    <!-- 2. Favicon & Search Logo Icons -->
    <link 
      rel="icon" 
      type="image/jpeg" 
      href="/favicon.jpeg" 
    />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- 3. Google Structured Data (Schema.org) - Ye Google Bot ko exact Site Name batata hai -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Ashu Jha",
      "alternateName": ["Ashu Studio", "Ashu Jha Portfolio"],
      "url": "https://ashujhaportfolio.vercel.app/"
    }
    </script>

    <!-- SEO Meta Tags -->
    <meta name="description" content="Ashu Studio crafts high-impact digital experiences — from 3D interactive web platforms to full-stack applications and AI workflows." />
    <meta name="author" content="Ashu Jha" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
